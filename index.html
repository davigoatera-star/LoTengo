<!DOCTYPE html>
<html>
<head>
<title>LoTengo Test</title>
<style>
body{
font-family:Arial;
display:flex;
height:100vh;
justify-content:center;
align-items:center;
background:#f5f5f5;
}

.box{
background:white;
padding:40px;
border-radius:20px;
text-align:center;
box-shadow:0 5px 20px #ddd;
}
</style>
</head>

<body>

<div class="box">

<h1>LoTengo funcionando</h1>

<p id="resultado">
Conectando con Supabase...
</p>

</div>


<script>

const SUPABASE_URL = "https://oqudaukvclkywcjocfkx.supabase.co";

const SUPABASE_KEY = "sb_publishable_QRkfDmrq0bk74BYA9W0ABQ_Uy9qgkqH";


fetch(
SUPABASE_URL + "/rest/v1/hosting_test?select=mensaje",
{
method:"GET",
headers:{
"apikey": SUPABASE_KEY,
"Authorization": "Bearer " + SUPABASE_KEY
}
}
)

.then(response => {
if(!response.ok){
throw new Error("HTTP " + response.status);
}
return response.json();
})

.then(data => {

document.getElementById("resultado").innerHTML =
"✅ Supabase OK: " + data[0].mensaje;

})

.catch(error => {

document.getElementById("resultado").innerHTML =
"❌ Error: " + error.message;

});

</script>

</body>
</html>
